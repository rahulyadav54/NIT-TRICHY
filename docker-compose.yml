services:
  postgres:
    image: postgres:16-alpine
    container_name: udyamflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: udyam_user
      POSTGRES_PASSWORD: udyam_password
      POSTGRES_DB: udyamflow_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udyam_user -d udyamflow_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

